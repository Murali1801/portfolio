<!doctype html>
<!--
  Source for public/og.png (1200x630). Edit, then render it with any headless Chrome:
  chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 --screenshot=public/og.png scripts/og.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=block"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #f3f0e8;
        color: #16150f;
        font-family: 'Schibsted Grotesk', sans-serif;
      }
      .cols {
        position: absolute;
        inset: 0 64px;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 20px;
      }
      .cols span { box-shadow: inset 1px 0 0 rgb(39 71 217 / 0.16), inset -1px 0 0 rgb(39 71 217 / 0.16); background: rgb(39 71 217 / 0.03); }
      .wrap { position: absolute; inset: 56px 64px; display: flex; flex-direction: column; }
      .top { display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; }
      .brand { display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk'; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; text-transform: none; }
      .mark { display: inline-block; width: 22px; height: 22px; background: #f6d21f; box-shadow: inset 0 0 0 2px #16150f; }
      h1 { margin-top: 64px; font-size: 128px; font-weight: 700; line-height: 0.92; letter-spacing: -0.04em; }
      h1 .mark { width: 46px; height: 52px; margin-left: 10px; }
      .line { margin-top: 34px; font-size: 30px; line-height: 1.35; max-width: 640px; }
      .avatar { position: absolute; right: 0; top: 88px; width: 224px; height: 224px; image-rendering: pixelated; box-shadow: 0 0 0 2px #16150f; }
      .rows { position: absolute; right: 0; bottom: 0; width: 360px; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: #615d55; }
      .rows div { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid #d9d4c8; }
      .rows b { font-weight: 500; color: #16150f; }
    </style>
  </head>
  <body>
    <div class="cols"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="wrap">
      <div class="top"><span class="brand"><span class="mark"></span>Murali</span><span>github.com/Murali1801</span></div>
      <h1>Muralidhar<br />Acharya<span class="mark"></span></h1>
      <p class="line">Websites and mobile apps. Open-source tools for colour, UI and READMEs.</p>
      <img class="avatar" src="../public/avatar.png" alt="" />
      <div class="rows">
        <div><b>01 Tonal</b><span>Tool</span></div>
        <div><b>02 Sheet</b><span>Library</span></div>
        <div><b>03 Tab</b><span>App</span></div>
        <div><b>04 Masthead</b><span>Tool</span></div>
      </div>
    </div>
  </body>
</html>
